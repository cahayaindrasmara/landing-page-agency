<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Web Agency</title>
    <link rel="stylesheet" href="css/style.css" />
    <script
      src="https://kit.fontawesome.com/ad33c04fd0.js"
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <!-- Header -->
    <div id="header" class="fixed-top mx-auto">
      <div class="mx-auto align-items-center" style="max-width: 1770px">
        <nav class="navbar navbar-expand-xl">
          <div class="container">
            <div class="logo-container">
              <a class="navbar-brand" href="#"
                ><img src="image/logo-nexcent.png" class="img-fluid" alt="" />
              </a>
            </div>
            <button
              class="navbar-toggler"
              type="button"
              data-bs-toggle="collapse"
              data-bs-target="#navMenu"
              aria-controls="navMenu"
              aria-expanded="false"
              aria-label="Toggle navigation"
            >
              <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse gap-4" id="navMenu">
              <ul class="navbar-nav ms-auto mb-2 mb-xl-0 gap-xl-4 gap-1">
                <li class="nav-item">
                  <a href="#home" class="nav-link">Home</a>
                </li>
                <li class="nav-item">
                  <a href="#features" class="nav-link">Features</a>
                </li>
                <li class="nav-item">
                  <a href="#community" class="nav-link">Community</a>
                </li>
                <li class="nav-item">
                  <a href="#blog" class="nav-link">Blog</a>
                </li>
                <li class="nav-item">
                  <a href="#pricing" class="nav-link">Pricing</a>
                </li>
              </ul>
              <a class="btn-accent" href="#register">
                <span>Register Now</span>
                <i class="fa-solid fa-arrow-right-long"></i>
              </a>
            </div>
          </div>
        </nav>
      </div>
    </div>
    <!-- End Header -->

    <!-- Main -->
    <main>
      <!-- Section Hero -->
      <div class="section  mt-5"  style="background-color: #F5F7FA;">
        <div class="container">
          <div class="d-flex flex-row align-items-center">
            <div class="row row-cols-2 w-100">
              <div class="col mb-3">
                <div
                  class="d-flex flex-column justify-content-center gap-4 h-100"
                >
                  <h1>
                    Lessons and insights <br />
                    from 8 years
                  </h1>
                  <p>
                    Where to grow your business as a photographer: site or
                    social media?
                  </p>
                  <div class="w-max-content">
                    <a class="btn-accent" href="#register">
                      <span>Register</span>
                    </a>
                  </div>
                </div>
              </div>
              <div class="col mb-3">
                <div
                  class="d-flex flex-row align-items-center justify-content-center h-100"
                >
                  <img
                    src="/image/hero-image-1.png"
                    class="img-fluid"
                    style="max-height: 350px"
                    alt=""
                  />
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
      <!-- End Section Hero -->

      <!-- Section Client -->
       <div class="section">
        <div class="container">
          <div class="d-flex flex-column align-items-center justify-content-center gap-4">
            <h3>Our Clients</h3>
            <p>We have been working with some Fortune 500+ clients</p>
          </div>
        </div>
       </div>
      <!-- End Section Client -->
    </main>
    <!-- End Main -->

    <!-- Footer -->
    <!-- End Footer -->

    <!-- scripts -->
    <script src="js/bootstrap.bundle.min.js"></script>
  </body>
</html>
